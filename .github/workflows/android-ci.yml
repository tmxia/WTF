name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup old runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-ci.yml',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              } catch (error) { console.log(error.message); }
            }

  build:
    name: Assemble & Release
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          cache: true

      - name: Decode Keystore & Setup Signature
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "storeFile=../keystore.jks" > key.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> key.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 1. 精准提取变量并拼装版本号
      - name: Extract Version
        id: get_version
        run: |
          MAJOR=$(grep "val versionMajor" app/build.gradle.kts | awk -F'= ' '{print $2}' | tr -d ' ')
          MINOR=$(grep "val versionMinor" app/build.gradle.kts | awk -F'= ' '{print $2}' | tr -d ' ')
          PATCH=$(grep "val versionPatch" app/build.gradle.kts | awk -F'= ' '{print $2}' | tr -d ' ')
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "✅ 成功提取版本号: $VERSION"

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      # 2. 重命名 APK，复制到独立目录
      - name: Prepare Release Asset
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/WTF-v${{ env.VERSION_NAME }}.apk
          echo "✅ 产物已重命名为 WTF-v${{ env.VERSION_NAME }}.apk"

      # 3. 上传 Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTF-v${{ env.VERSION_NAME }}
          path: output/*.apk
          if-no-files-found: error

      
      # 强制删除旧的 Release 和 Tag，彻底解决 HttpError
      - name: Delete Existing Release and Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ env.VERSION_NAME }}" --yes || true
          git push --delete origin "v${{ env.VERSION_NAME }}" || true
          echo "✅ 已清理可能存在的旧 Tag 与 Release"

      # 4. 发布清爽的 Release
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            🚀 吾爱破解定制版 自动构建发布
            - **版本号**: v${{ env.VERSION_NAME }}
            - **构建号**: ${{ github.run_number }}
            - **提交**: ${{ github.sha }}
          files: output/WTF-v${{ env.VERSION_NAME }}.apk
          draft: false
          prerelease: false
          make_latest: true
