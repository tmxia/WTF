name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 清理任务：删除历史运行记录
  # ==========================================
  cleanup:
    name: Cleanup old runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-ci.yml', // 确保和你的文件名一致
              per_page: 100
            });
            
            for (const run of runs.data.workflow_runs) {
              // 跳过当前正在运行的这一次
              if (run.id === context.runId) continue;
              
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                console.log(`Deleted run ${run.id}`);
              } catch (error) {
                console.log(`Failed to delete run ${run.id}: ${error.message}`);
              }
            }

  # ==========================================
  # 构建任务
  # ==========================================
  build:
    name: Assemble Release
    needs: cleanup # 等清理完再构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          cache: true

      - name: Decode Keystore & Setup Signature
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "storeFile=../keystore.jks" > key.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> key.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
