name: Android CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore & Setup Signature
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "storeFile=../keystore.jks" > key.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> key.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint debug
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/reports/lint-results-debug.xml
            framework/build/reports/lint-results-debug.html
            framework/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            framework/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
