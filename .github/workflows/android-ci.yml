name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup old runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-ci.yml',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              } catch (error) { console.log(error.message); }
            }

  build:
    name: Assemble & Release
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 发布 Release 需要写入权限
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          cache: true

      - name: Decode Keystore & Setup Signature
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "storeFile=../keystore.jks" > key.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> key.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Release
        run: ./gradlew assembleRelease --no-daemon

      # 提取版本号，用于打 Tag
      - name: Extract Version
        id: get_version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Found version: $VERSION_NAME"

      # 上传到 Artifacts (临时产物)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 发布到 GitHub Releases
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-b${{ github.run_number }}
          name: Release v${{ env.VERSION_NAME }} (Build ${{ github.run_number }})
          body: |
            🚀 自动构建发布
            - **版本号**: v${{ env.VERSION_NAME }}
            - **构建号**: ${{ github.run_number }}
            - **提交**: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true
